    <meta charset="UTF-8" />

    <meta name="description" content="Sistema de gestión integral para torneos y ligas de barrio: fixtures, equipos, planteles, registro de actas y tabla de posiciones en tiempo real." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">
    <script>
      // Evitar que errores no fatales de notificación en bucle de ResizeObserver detengan la app
      (function() {
        var isResizeObserver = function(err) {
          if (!err) return false;
          var msg = err.message || (typeof err === 'string' ? err : '');
          return msg.indexOf('ResizeObserver') !== -1;
        };
        window.addEventListener('error', function(e) {
          if (isResizeObserver(e) || (e.error && isResizeObserver(e.error))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && (isResizeObserver(e.reason) || (e.reason && isResizeObserver(e.reason.message)))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
